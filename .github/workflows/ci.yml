name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    if: hashFiles('be/**') != ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    if: hashFiles('fe/**') != ''
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
